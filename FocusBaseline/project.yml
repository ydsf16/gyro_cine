name: GyroCineRebuild
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_OBJC_BRIDGING_HEADER: Sources/RAWFocusTest-Bridging-Header.h
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: 'Preview and record video with camera controls.'
    INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Record audio with your video.'
    INFOPLIST_KEY_CFBundleDisplayName: 'GyroCine Rebuild'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.tinygrape.GyroCineRebuild
    DEVELOPMENT_TEAM: F2LVFHW3ZH
    CODE_SIGN_STYLE: Automatic
targets:
  GyroCineRebuild:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
