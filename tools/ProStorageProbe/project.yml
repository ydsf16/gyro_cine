name: ProStorageProbe
options:
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_OBJC_BRIDGING_HEADER: Sources/ExceptionGuard.h
    DEVELOPMENT_TEAM: F2LVFHW3ZH
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.tinygrape.ProStorageProbe
    INFOPLIST_KEY_CFBundleDisplayName: RAW Storage Probe
    INFOPLIST_KEY_NSCameraUsageDescription: Test RAW recording to dedicated storage.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Test audio recording.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: '1'
targets:
  ProStorageProbe:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
