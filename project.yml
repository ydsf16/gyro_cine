name: gyro_cine
options:
  deploymentTarget:
    iOS: '18.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '20261015.1'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_NSMotionUsageDescription: 'Record motion data and determine recording orientation.'
    SWIFT_OBJC_BRIDGING_HEADER: Sources/RAWFocusTest-Bridging-Header.h
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: 'Preview and record video with camera controls.'
    INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Record audio with your video.'
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Save selected recordings to your photo library.'
    INFOPLIST_KEY_CFBundleDisplayName: 'GyroCine'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.tinygrape.RawMotionRecorder
    DEVELOPMENT_TEAM: F2LVFHW3ZH
    CODE_SIGN_STYLE: Automatic
targets:
  GyroCine:
    type: application
    platform: iOS
    info:
      path: Resources/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    sources: [Sources, Resources]
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
  GyroCineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GyroCine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinygrape.RawMotionRecorderUITests
        TEST_TARGET_NAME: GyroCine
  GyroCineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GyroCine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinygrape.RawMotionRecorderTests
