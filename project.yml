name: gyro_cine
options:
  bundleIdPrefix: com.tinygrape
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 18.2
    TARGETED_DEVICE_FAMILY: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: GyroCine
    INFOPLIST_KEY_NSCameraUsageDescription: Record video with motion data.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Record synchronized audio.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save recorded videos to your photo library.
    INFOPLIST_KEY_NSMotionUsageDescription: Record raw gyroscope and accelerometer samples.
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F2LVFHW3ZH
targets:
  GyroCine:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    sources:
      - App
      - Features
      - Capture
      - Motion
      - Telemetry
      - Recording
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinygrape.RawMotionRecorder
        SWIFT_OBJC_BRIDGING_HEADER: App/GyroCine-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  GyroCineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GyroCine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinygrape.RawMotionRecorderTests
  GyroCineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GyroCine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinygrape.RawMotionRecorderUITests
        TEST_TARGET_NAME: GyroCine
